    <script type="text/javascript">
    // -------------------------------------------------------------
    // Utils
    // -------------------------------------------------------------
    function openLink(link) {
        switch(event.target.className) {
            case "fake_a":
                break;
            case "subtxt":
            default:
                // prevent to open on mouseover or and so on.
                return;
        }
        window.open(link, '_blank', '', '');
    }

    // -------------------------------------------------------------
    // Category Utils
    // -------------------------------------------------------------
    var _body = document.getElementById("body");
    const indexID = "_index";

    function genIndex(sections) {
        // gen index of sections
        /*
            ============================
            = General Computer Science =
            = Machine Learning         =
            = ...
            = ETC                      =
            ============================
        */
        const base = `<div id="${indexID}"><h3>Index</h3><br/></div>`
        _body.insertAdjacentHTML("beforeend", base);

        var _index = document.getElementById(indexID);
        for(var i=0; i<sections.length; i++) {
            var section = sections[i];
            var head = section.head;
            const row = `<span class="fake_a index_a" onclick="location.href='#${head}'">${head}</span><br/>`
            _index.insertAdjacentHTML("beforeend", row);
        }

        _body.insertAdjacentHTML("beforeend", `<br/><br/>`);
    }

    function __main(data) {
        var sections = data.sections;
        genIndex(sections);

        for(var i=0; i<sections.length; i++) {
            attachSection(sections[i]);
            _body.insertAdjacentHTML("beforeend", "<br/><br/>");
        }
    }

    function attachSection(section) {       
        var head = section.head;
        const T_sectionHead = `<h3 id="${head}">${head}</h3>`;
        _body.insertAdjacentHTML("beforeend", T_sectionHead);

        var subhead = section.subhead;
        const T_sectionSubHead = `<h5 class='subhead'>${subhead}</h5>`;
        if(subhead != null && subhead != undefined) {
            _body.insertAdjacentHTML("beforeend", T_sectionSubHead);
        }

        const T_goToTop = `<img src="data:image/*;base64,${binary_data}" 
                                width=16 height=16 class="go_to_top" onclick="location.href='#${indexID}'"/>`;
        _body.insertAdjacentHTML("beforeend", T_goToTop);

        _body.insertAdjacentHTML("beforeend", `<br/>`);

        var elems = section.elems;
        for(var i=0; i<elems.length; i++) {
            attachSectionElem(elems[i]);
        }
    }

    function attachSectionElem(elem) {
        var T_mouseover = "";
        if(elem.mouseover != undefined) {
            if(elem.mouseover.list != undefined) {
                var list = attachSectionListElem(elem.mouseover.list, false);
                T_mouseover = `<div class="mouse_over_only">${list}</div>`
            } else if(elem.mouseover.txt != undefined) {
                var txt = elem.mouseover.txt;
                T_mouseover = `<div class="mouse_over_only">${txt}</div>`
            }
        }

        if(elem.url != undefined) {
            var url = elem.url;
            var txt = elem.txt == undefined ? "" : elem.txt;
            var subtxt = elem.subtxt == undefined ? "" : elem.subtxt;
            const T_section = 
                `<span class="fake_a" onclick="openLink('${url}')">${txt}<span class="subtxt"> ${subtxt}</span><br>${T_mouseover}</span>`;
            _body.insertAdjacentHTML("beforeend", T_section);
        } else {
            var txt = elem.txt == undefined ? "" : elem.txt;
            const T_simpletxt = `${txt}<br>`;
            _body.insertAdjacentHTML("beforeend", T_simpletxt);

            attachSectionListElem(elem.elems);
        }

        if(elem.always != undefined) {
            attachSectionListElem(elem.always.list);
        }
    }

    function attachSectionListElem(lists, append=true) {
        if(lists == undefined) return;

        var _li = "";
        for(var i=0; i<lists.length; i++) {
            var elem = lists[i];
            var T_mouseover = "";
            if(elem.mouseover != undefined) {
                if(elem.mouseover.list != undefined) {
                    var list = attachSectionListElem(elem.mouseover.list, false);
                    T_mouseover = `<div class="mouse_over_only">${list}</div>`
                } else if(elem.mouseover.txt != undefined) {
                    var txt = elem.mouseover.txt;
                    T_mouseover = `<div class="mouse_over_only">${txt}</div>`
                }
            }

            var url = elem.url;
            var txt = elem.txt;
            var subtxt = elem.subtxt == undefined ? "" : elem.subtxt;

            if(url == undefined && txt == undefined) {
                _li += `<li>${elem}</li>`;
            } else {
                _li += `<li><span class="fake_a" onclick="openLink('${url}')">${txt}<span class="subtxt"> ${subtxt}</span><br>${T_mouseover}</span></li>`;
            }
        }
        const T_lists = `<ul>${_li}</ul>`;

        if(append) {
            _body.insertAdjacentHTML("beforeend", `${T_lists} <br>`);
        } 
        return T_lists;
    }
