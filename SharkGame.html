        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.survivors = [];
                this.sharks = [];
                this.gameRunning = false;
                this.gameStartTime = 0;
                this.sharksSpawned = false;
                this.winner = null;
                this.whirlpools = [];
                this.winnerDisplayTimer = 0;
                this.screenShake = 0;
                this.rushParticles = [];
                this.teleportEffects = [];
                this.sharkImage = null;
                
                this.loadSharkImage();
                this.setupEventListeners();
                this.adjustCanvasSize();
                this.generateZones();
                this.gameLoop();
            }
            
            loadSharkImage() {
                // Create an image from the SVG data
                const blob = new Blob([sharkSVG], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                
                this.sharkImage = new Image();
                this.sharkImage.onload = () => {
                    console.log('Shark SVG loaded successfully');
                    URL.revokeObjectURL(url);
                };
                this.sharkImage.src = url;
            }
            
            setupEventListeners() {
                document.getElementById('startBtn').addEventListener('click', () => this.startGame());
                document.getElementById('resetBtn').addEventListener('click', () => this.resetGame());
                window.addEventListener('resize', () => this.adjustCanvasSize());
            }
            
            adjustCanvasSize() {
                const container = document.querySelector('.game-container');
                const containerWidth = container.clientWidth - 40;
                const isMobile = window.innerWidth <= 767;
                
                if (isMobile) {
                    const maxWidth = Math.min(containerWidth, window.innerWidth - 20);
                    const aspectRatio = 800 / 500;
                    
                    this.canvas.style.width = maxWidth + 'px';
                    this.canvas.style.height = (maxWidth / aspectRatio) + 'px';
                } else {
                    const maxWidth = Math.min(800, containerWidth);
                    const aspectRatio = 800 / 500;
                    
                    this.canvas.style.width = maxWidth + 'px';
                    this.canvas.style.height = (maxWidth / aspectRatio) + 'px';
                }
            }
            
            generateZones() {
                this.whirlpools = [];
                
                // Generate 3-5 whirlpools
                const whirlpoolCount = Math.floor(Math.random() * 3) + 3;
                for (let i = 0; i < whirlpoolCount; i++) {
                    let attempts = 0;
                    let validPosition = false;
                    let newWhirlpool;
                    
                    while (!validPosition && attempts < 50) {
                        newWhirlpool = {
                            x: Math.random() * (this.canvas.width - 140) + 70,
                            y: Math.random() * (this.canvas.height - 140) + 70,
                            radius: Math.random() * 30 + 50,
                            centerRadius: 23, // Center zone for teleportation
                            rotation: 0,
                            spiralArms: []
                        };
                        
                        // Generate spiral arms for visual effect
                        for (let arm = 0; arm < 3; arm++) {
                            newWhirlpool.spiralArms.push({
                                baseAngle: (arm / 3) * Math.PI * 2,
                                particles: []
                            });
                        }
                        
                        validPosition = true;
                        for (let j = 0; j < this.whirlpools.length; j++) {
                            const existing = this.whirlpools[j];
                            const dx = newWhirlpool.x - existing.x;
                            const dy = newWhirlpool.y - existing.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            const minDistance = newWhirlpool.radius + existing.radius + 30;
                            
                            if (distance < minDistance) {
                                validPosition = false;
                                break;
                            }
                        }
                        attempts++;
                    }
                    
                    if (validPosition) {
                        this.whirlpools.push(newWhirlpool);
                    }
                }
            }
            
            startGame() {
                const survivorsInput = document.getElementById('survivorsInput').value;
                const sharksCount = parseInt(document.getElementById('sharksInput').value);
                
                if (!survivorsInput.trim()) {
                    alert('Please enter survivors!');
                    return;
                }
                
                this.parseSurvivors(survivorsInput);
                this.spawnSurvivors();
                this.generateZones();
                this.gameRunning = true;
                this.gameStartTime = Date.now();
                this.sharksSpawned = false;
                this.winner = null;
                this.winnerDisplayTimer = 0;
                this.teleportEffects = [];
                
                document.getElementById('startBtn').disabled = true;
                document.getElementById('gameStatus').textContent = 'Game Started! Sharks spawning in 3 seconds...';
                document.getElementById('winnerAnnouncement').style.display = 'none';
                
                setTimeout(() => {
                    this.spawnSharks(sharksCount);
                    this.sharksSpawned = true;
                    document.getElementById('gameStatus').textContent = 'Sharks released! Survive!';
                }, 3000);
            }
            
            parseSurvivors(input) {
                this.survivors = [];
                const parts = input.split(',');
                const nameColors = {};
                const colorPalette = [
                    '#4CAF50', '#2196F3', '#FF9800', '#E91E63', '#9C27B0', 
                    '#00BCD4', '#8BC34A', '#FF5722', '#795548', '#607D8B',
                    '#F44336', '#FFEB3B', '#3F51B5', '#009688', '#FFC107'
                ];
                let colorIndex = 0;
                
                parts.forEach(part => {
                    part = part.trim();
                    if (part.includes('*')) {
                        const [name, countStr] = part.split('*');
                        const cleanName = name.trim();
                        const count = parseInt(countStr) || 1;
                        
                        if (!nameColors[cleanName]) {
                            nameColors[cleanName] = colorPalette[colorIndex % colorPalette.length];
                            colorIndex++;
                        }
                        
                        for (let i = 0; i < count; i++) {
                            this.survivors.push(new Survivor(cleanName, i + 1, nameColors[cleanName]));
                        }
                    } else {
                        const cleanName = part.trim();
                        if (!nameColors[cleanName]) {
                            nameColors[cleanName] = colorPalette[colorIndex % colorPalette.length];
                            colorIndex++;
                        }
                        this.survivors.push(new Survivor(cleanName, 1, nameColors[cleanName]));
                    }
                });
            }
            
            spawnSurvivors() {
                this.survivors.forEach(survivor => {
                    const margin = survivor.size + 10;
                    survivor.x = Math.random() * (this.canvas.width - 2 * margin) + margin;
                    survivor.y = Math.random() * (this.canvas.height - 2 * margin) + margin;
                    survivor.vx = (Math.random() - 0.5) * 2;
                    survivor.vy = (Math.random() - 0.5) * 2;
                });
            }
            
            spawnSharks(count) {
                this.sharks = [];
                for (let i = 0; i < count; i++) {
                    const shark = new Shark(this.sharkImage);
                    const margin = shark.size * 1.5 + 10;
                    shark.x = Math.random() * (this.canvas.width - 2 * margin) + margin;
                    shark.y = Math.random() * (this.canvas.height - 2 * margin) + margin;
                    shark.vx = (Math.random() - 0.5) * 2;
                    shark.vy = (Math.random() - 0.5) * 2;
                    this.sharks.push(shark);
                }
            }
            
            resetGame() {
                this.gameRunning = false;
                this.survivors = [];
                this.sharks = [];
                this.sharksSpawned = false;
                this.winner = null;
                this.winnerDisplayTimer = 0;
                this.screenShake = 0;
                this.rushParticles = [];
                this.teleportEffects = [];
                this.generateZones();
                document.getElementById('startBtn').disabled = false;
                document.getElementById('gameStatus').textContent = 'Enter survivors and click Start Game';
                document.getElementById('winnerAnnouncement').style.display = 'none';
                this.updateUI();
            }
            
            update() {
                if (!this.gameRunning && !this.winner) return;
                
                if (this.gameRunning) {
                    // Update screen shake
                    if (this.screenShake > 0) {
                        this.screenShake--;
                    }
                    
                    // Update rush particles
                    this.rushParticles = this.rushParticles.filter(particle => {
                        particle.x += particle.vx;
                        particle.y += particle.vy;
                        particle.life--;
                        particle.alpha = particle.life / particle.maxLife;
                        return particle.life > 0;
                    });
                    
                    // Update teleport effects
                    this.teleportEffects = this.teleportEffects.filter(effect => {
                        effect.life--;
                        effect.alpha = effect.life / effect.maxLife;
                        effect.scale = 1 + (1 - effect.alpha) * 2;
                        return effect.life > 0;
                    });
                    
                    // Update whirlpools
                    this.whirlpools.forEach(whirlpool => {
                        whirlpool.rotation += 0.05;
                        
                        whirlpool.spiralArms.forEach(arm => {
                            if (Math.random() < 0.1) {
                                arm.particles.push({
                                    distance: whirlpool.radius,
                                    angle: arm.baseAngle + whirlpool.rotation,
                                    life: 60,
                                    maxLife: 60
                                });
                            }
                            
                            arm.particles = arm.particles.filter(particle => {
                                particle.distance -= 1;
                                particle.angle += 0.1;
                                particle.life--;
                                return particle.life > 0 && particle.distance > 5;
                            });
                        });
                    });
                    
                    // Update survivors
                    this.survivors.forEach(survivor => {
                        survivor.update(this.sharks, this.whirlpools, this.canvas.width, this.canvas.height, this.teleportEffects, this.survivors);
                    });
                    
                    // Handle survivor collisions
                    this.handleSurvivorCollisions();
                    
                    // Update sharks
                    this.sharks.forEach(shark => {
                        shark.update(this.survivors, this.sharks, this.canvas.width, this.canvas.height, this.rushParticles);
                        
                        if (shark.eating) {
                            if (Math.random() < 0.3) {
                                this.screenShake = Math.max(this.screenShake, 6);
                            }
                            
                            for (let i = 0; i < 3; i++) {
                                this.rushParticles.push({
                                    x: shark.x + (Math.random() - 0.5) * 25,
                                    y: shark.y + (Math.random() - 0.5) * 25,
                                    vx: (Math.random() - 0.5) * 2,
                                    vy: (Math.random() - 0.5) * 2,
                                    life: 20,
                                    maxLife: 20,
                                    alpha: 1,
                                    size: Math.random() * 3 + 1,
                                    color: 'splash'
                                });
                            }
                        }
                    });
                    
                    // Check collisions
                    this.checkCollisions();
                    
                    // Check win condition
                    if (this.survivors.length === 1) {
                        this.gameRunning = false;
                        this.winner = this.survivors[0];
                        this.winnerDisplayTimer = 180;
                        document.getElementById('gameStatus').textContent = 'Game Over!';
                        document.getElementById('winnerAnnouncement').textContent = `🏆 ${this.winner.name} #${this.winner.number} WINS! 🏆`;
                        document.getElementById('winnerAnnouncement').style.display = 'block';
                    } else if (this.survivors.length === 0) {
                        this.gameRunning = false;
                        this.winner = { name: 'Sharks', number: '' };
                        this.winnerDisplayTimer = 180;
                        document.getElementById('gameStatus').textContent = 'Game Over!';
                        document.getElementById('winnerAnnouncement').textContent = '🦈 Sharks Win! No survivors left! 🦈';
                        document.getElementById('winnerAnnouncement').style.display = 'block';
                    }
                }
                
                // Handle winner display timer and auto-reset
                if (this.winner && this.winnerDisplayTimer > 0) {
                    this.winnerDisplayTimer--;
                    if (this.winnerDisplayTimer === 0) {
                        this.resetGame();
                    }
                }
                
                this.updateUI();
            }
            
            checkCollisions() {
                for (let i = this.survivors.length - 1; i >= 0; i--) {
                    const survivor = this.survivors[i];
                    
                    for (let j = 0; j < this.sharks.length; j++) {
                        const shark = this.sharks[j];
                        
                        if (shark.eating) continue;
                        
                        const dx = survivor.x - shark.x;
                        const dy = survivor.y - shark.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < shark.size * 1.5 + survivor.size) {
                            shark.startEating();
                            console.log('Shark caught survivor!');
                            
                            this.survivors.splice(i, 1);
                            break;
                        }
                    }
                }
            }
            
            handleSurvivorCollisions() {
                for (let i = 0; i < this.survivors.length; i++) {
                    for (let j = i + 1; j < this.survivors.length; j++) {
                        const survivor1 = this.survivors[i];
                        const survivor2 = this.survivors[j];
                        
                        const dx = survivor1.x - survivor2.x;
                        const dy = survivor1.y - survivor2.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const minDistance = survivor1.size + survivor2.size + 2;
                        
                        if (distance < minDistance) {
                            const overlap = minDistance - distance;
                            const separation = overlap / 2;
                            
                            if (distance > 0) {
                                const pushX = (dx / distance) * separation;
                                const pushY = (dy / distance) * separation;
                                
                                survivor1.x += pushX;
                                survivor1.y += pushY;
                                survivor2.x -= pushX;
                                survivor2.y -= pushY;
                                
                                this.enforceBoundaries(survivor1);
                                this.enforceBoundaries(survivor2);
                            } else {
                                const angle = Math.random() * Math.PI * 2;
                                const pushX = Math.cos(angle) * separation;
                                const pushY = Math.sin(angle) * separation;
                                
                                survivor1.x += pushX;
                                survivor1.y += pushY;
                                survivor2.x -= pushX;
                                survivor2.y -= pushY;
                                
                                this.enforceBoundaries(survivor1);
                                this.enforceBoundaries(survivor2);
                            }
                        }
                    }
                }
            }
            
            enforceBoundaries(entity) {
                const margin = entity.size + 5;
                entity.x = Math.max(margin, Math.min(this.canvas.width - margin, entity.x));
                entity.y = Math.max(margin, Math.min(this.canvas.height - margin, entity.y));
            }
            
            updateUI() {
                document.getElementById('survivorCount').textContent = `Survivors: ${this.survivors.length}`;
                document.getElementById('sharkCount').textContent = `Sharks: ${this.sharks.length}`;
            }
            
            draw() {
                let shakeX = 0, shakeY = 0;
                if (this.screenShake > 0) {
                    shakeX = (Math.random() - 0.5) * this.screenShake;
                    shakeY = (Math.random() - 0.5) * this.screenShake;
                }
                
                this.ctx.save();
                this.ctx.translate(shakeX, shakeY);
                
                this.ctx.clearRect(-10, -10, this.canvas.width + 20, this.canvas.height + 20);
                
                // Draw water effect
                this.ctx.fillStyle = 'rgba(0, 116, 217, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw whirlpools
                this.whirlpools.forEach(whirlpool => {
                    this.ctx.save();
                    this.ctx.translate(whirlpool.x, whirlpool.y);
                    
                    // Draw main whirlpool body
                    const gradient = this.ctx.createRadialGradient(0, 0, 0, 0, 0, whirlpool.radius);
                    gradient.addColorStop(0, 'rgba(0, 50, 100, 0.8)');
                    gradient.addColorStop(0.3, 'rgba(0, 100, 150, 0.6)');
                    gradient.addColorStop(0.7, 'rgba(0, 150, 200, 0.4)');
                    gradient.addColorStop(1, 'rgba(0, 200, 255, 0.2)');
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, whirlpool.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // Draw center teleport zone
                    this.ctx.fillStyle = 'rgba(255, 0, 255, 0.3)';
                    this.ctx.strokeStyle = 'rgba(255, 0, 255, 0.8)';
                    this.ctx.lineWidth = 2;
                    this.ctx.setLineDash([5, 5]);
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, whirlpool.centerRadius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.stroke();
                    this.ctx.setLineDash([]);
                    
                    // Draw spiral arms
                    whirlpool.spiralArms.forEach(arm => {
                        this.ctx.strokeStyle = 'rgba(100, 200, 255, 0.6)';
                        this.ctx.lineWidth = 2;
                        this.ctx.beginPath();
                        
                        for (let r = whirlpool.radius; r > whirlpool.centerRadius; r -= 3) {
                            const angle = arm.baseAngle + whirlpool.rotation + (whirlpool.radius - r) * 0.1;
                            const x = Math.cos(angle) * r;
                            const y = Math.sin(angle) * r;
                            
                            if (r === whirlpool.radius) {
                                this.ctx.moveTo(x, y);
                            } else {
                                this.ctx.lineTo(x, y);
                            }
                        }
                        this.ctx.stroke();
                        
                        // Draw particles on spiral arms
                        arm.particles.forEach(particle => {
                            const x = Math.cos(particle.angle) * particle.distance;
                            const y = Math.sin(particle.angle) * particle.distance;
                            const alpha = particle.life / particle.maxLife;
                            
                            this.ctx.fillStyle = `rgba(150, 230, 255, ${alpha})`;
                            this.ctx.beginPath();
                            this.ctx.arc(x, y, 2, 0, Math.PI * 2);
                            this.ctx.fill();
                        });
                    });
                    
                    // Draw whirlpool symbol
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    this.ctx.font = '20px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('🌀', 0, 7);
                    
                    this.ctx.restore();
                });
                
                // Draw teleport effects
                this.teleportEffects.forEach(effect => {
                    this.ctx.save();
                    this.ctx.globalAlpha = effect.alpha;
                    this.ctx.translate(effect.x, effect.y);
                    this.ctx.scale(effect.scale, effect.scale);
                    
                    this.ctx.fillStyle = effect.color;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2;
                        const distance = 15 + Math.sin(effect.life * 0.2) * 5;
                        const x = Math.cos(angle) * distance;
                        const y = Math.sin(angle) * distance;
                        
                        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                        this.ctx.beginPath();
                        this.ctx.arc(x, y, 2, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                    
                    this.ctx.restore();
                });
                
                // Draw rush particles
                this.rushParticles.forEach(particle => {
                    let color;
                    if (particle.color === 'red') {
                        color = `rgba(139, 0, 0, ${particle.alpha})`;
                    } else if (particle.color === 'splash') {
                        color = `rgba(135, 206, 235, ${particle.alpha})`;
                    } else if (particle.color === 'rush') {
                        color = `rgba(255, 107, 53, ${particle.alpha})`;
                    } else {
                        color = `rgba(255, 0, 0, ${particle.alpha})`;
                    }
                    this.ctx.fillStyle = color;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                
                // Draw survivors
                this.survivors.forEach(survivor => {
                    survivor.draw(this.ctx);
                });
                
                // Draw sharks
                this.sharks.forEach(shark => {
                    shark.draw(this.ctx);
                });
                
                this.ctx.restore();
                
                // Draw countdown
                if (this.gameRunning && !this.sharksSpawned) {
                    const elapsedTime = Date.now() - this.gameStartTime;
                    const remainingTime = Math.max(0, 3000 - elapsedTime);
                    const countdown = Math.ceil(remainingTime / 1000);
                    
                    if (countdown > 0) {
                        const centerX = this.canvas.width / 2;
                        const centerY = this.canvas.height / 2;
                        
                        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                        this.ctx.beginPath();
                        this.ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
                        this.ctx.fill();
                        
                        this.ctx.strokeStyle = '#ff6b6b';
                        this.ctx.lineWidth = 4;
                        this.ctx.beginPath();
                        this.ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
                        this.ctx.stroke();
                        
                        this.ctx.fillStyle = '#ff6b6b';
                        this.ctx.font = 'bold 48px Arial';
                        this.ctx.textAlign = 'center';
                        this.ctx.fillText(countdown.toString(), centerX, centerY + 15);
                        
                        this.ctx.fillStyle = '#333';
                        this.ctx.font = 'bold 16px Arial';
                        this.ctx.fillText('SHARKS INCOMING', centerX, centerY - 80);
                    }
                }
                
                // Draw winner text
                if (this.winner && this.winnerDisplayTimer > 0) {
                    const centerX = this.canvas.width / 2;
                    const centerY = this.canvas.height / 2;
                    
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    this.ctx.fillRect(centerX - 200, centerY - 50, 400, 100);
                    
                    this.ctx.fillStyle = '#FFD700';
                    this.ctx.font = 'bold 28px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.strokeStyle = '#000';
                    this.ctx.lineWidth = 2;
                    
                    const winnerText = this.winner.name === 'Sharks' ? 
                        '🦈 SHARKS WIN! 🦈' : 
                        `🏆 ${this.winner.name} #${this.winner.number} WINS! 🏆`;
                    
                    this.ctx.strokeText(winnerText, centerX, centerY);
                    this.ctx.fillText(winnerText, centerX, centerY);
                }
            }
            
            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }
        
        class Survivor {
            constructor(name, number, color) {
                this.name = name;
                this.number = number;
                this.color = color;
                this.x = 0;
                this.y = 0;
                this.vx = 0;
                this.vy = 0;
                this.baseSpeed = 1.0;
                this.boosted = false;
                this.boostTimer = 0;
                this.directionChangeTimer = 0;
                this.edgeTimer = 0;
                this.size = 8;
                this.inWhirlpool = null;
                this.whirlpoolCenterTimer = 0; // Timer for staying in whirlpool center
                this.teleporting = false;
                this.teleportTimer = 0;
            }
            
            update(sharks, whirlpools, canvasWidth, canvasHeight, teleportEffects, allSurvivors) {
                // Handle teleportation state
                if (this.teleporting) {
                    this.teleportTimer--;
                    if (this.teleportTimer <= 0) {
                        this.teleporting = false;
                        const margin = this.size + 20;
                        this.x = Math.random() * (canvasWidth - 2 * margin) + margin;
                        this.y = Math.random() * (canvasHeight - 2 * margin) + margin;
                        
                        teleportEffects.push({
                            x: this.x,
                            y: this.y,
                            life: 30,
                            maxLife: 30,
                            alpha: 1,
                            scale: 0.5,
                            color: 'rgba(255, 0, 255, 0.8)'
                        });
                        
                        this.vx = (Math.random() - 0.5) * 2;
                        this.vy = (Math.random() - 0.5) * 2;
                        this.edgeTimer = 0;
                        this.whirlpoolCenterTimer = 0;
                        this.inWhirlpool = null;
                    }
                    return;
                }
                
                // Random speed boost
                if (Math.random() < 0.005 && !this.boosted) {
                    this.boosted = true;
                    this.boostTimer = 180;
                }
                
                if (this.boosted) {
                    this.boostTimer--;
                    if (this.boostTimer <= 0) {
                        this.boosted = false;
                    }
                }
                
                const speed = this.boosted ? this.baseSpeed * 2.0 : this.baseSpeed;
                
                // Check whirlpool physics
                let affectedByWhirlpool = false;
                whirlpools.forEach(whirlpool => {
                    const dx = this.x - whirlpool.x;
                    const dy = this.y - whirlpool.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < whirlpool.radius) {
                        affectedByWhirlpool = true;
                        this.inWhirlpool = whirlpool;
                        
                        // Check if in center zone
                        if (distance <= whirlpool.centerRadius) {
                            this.whirlpoolCenterTimer++;
                            
                            // If in center for 2 seconds (120 frames), teleport
                            if (this.whirlpoolCenterTimer >= 120) {
                                // Start teleportation with flash effect
                                this.teleporting = true;
                                this.teleportTimer = 30;
                                
                                // Add teleport departure effect
                                teleportEffects.push({
                                    x: this.x,
                                    y: this.y,
                                    life: 20,
                                    maxLife: 20,
                                    alpha: 1,
                                    scale: 1,
                                    color: 'rgba(0, 255, 255, 0.8)'
                                });
                                
                                return; // Exit early to start teleporting
                            }
                            
                            // Continue pulling toward exact center even in teleport zone
                            const centerPullForce = 0.04; // Strong pull toward exact center
                            const centerSwirl = 0.02; // Gentle swirl in center
                            
                            this.vx = this.vx * 0.9 + (-dx * centerPullForce + -dy * centerSwirl);
                            this.vy = this.vy * 0.9 + (-dy * centerPullForce + dx * centerSwirl);
                            
                            // Allow controlled movement in center zone
                            const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                            const maxCenterSpeed = this.baseSpeed * 0.8; // Slightly slower in center but still moving
                            if (currentSpeed > maxCenterSpeed) {
                                this.vx = (this.vx / currentSpeed) * maxCenterSpeed;
                                this.vy = (this.vy / currentSpeed) * maxCenterSpeed;
                            }
                        } else {
                            // Not in center, reset timer
                            this.whirlpoolCenterTimer = 0;
                            
                            // Apply stronger swirling force toward center for faster pull
                            const centerForce = 0.025; // Increased from 0.01
                            const swirl = 0.035; // Increased from 0.015
                            
                            // Apply stronger forces to pull survivors toward center faster
                            this.vx = this.vx * 0.95 + (-dx * centerForce + -dy * swirl);
                            this.vy = this.vy * 0.95 + (-dy * centerForce + dx * swirl);
                            
                            // Allow slightly higher speed in whirlpools for faster pull
                            const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                            const maxSpeed = this.baseSpeed * (this.boosted ? 2.5 : 1.5); // Increased max speed in whirlpools
                            if (currentSpeed > maxSpeed) {
                                this.vx = (this.vx / currentSpeed) * maxSpeed;
                                this.vy = (this.vy / currentSpeed) * maxSpeed;
                            }
                        }
                        
                        return; // Skip normal movement while in whirlpool
                    }
                });
                
                if (!affectedByWhirlpool) {
                    this.inWhirlpool = null;
                    this.whirlpoolCenterTimer = 0;
                }
                
                // Skip normal movement if affected by whirlpool
                if (affectedByWhirlpool) {
                    // Update position while in whirlpool
                    this.x += this.vx;
                    this.y += this.vy;
                    return;
                }
                
                // Find nearest shark
                let nearestShark = null;
                let nearestDistance = Infinity;
                
                sharks.forEach(shark => {
                    const dx = this.x - shark.x;
                    const dy = this.y - shark.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < nearestDistance) {
                        nearestDistance = distance;
                        nearestShark = shark;
                    }
                });
                
                // Move away from nearest shark
                if (nearestShark && nearestDistance < 200) {
                    const dx = this.x - nearestShark.x;
                    const dy = this.y - nearestShark.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance > 0) {
                        const oppositeX = (dx / distance) * speed;
                        const oppositeY = (dy / distance) * speed;
                        
                        if (Math.random() < 0.8) {
                            this.vx = oppositeX;
                            this.vy = oppositeY;
                        } else {
                            this.vx = (Math.random() - 0.5) * speed * 2;
                            this.vy = (Math.random() - 0.5) * speed * 2;
                        }
                    }
                } else {
                    this.directionChangeTimer++;
                    if (this.directionChangeTimer > 80) {
                        this.vx = (Math.random() - 0.5) * speed * 2;
                        this.vy = (Math.random() - 0.5) * speed * 2;
                        this.directionChangeTimer = 0;
                    }
                }
                
                // Update position
                this.x += this.vx;
                this.y += this.vy;
                
                // Enhanced edge detection for teleportation
                const edgeDistance = 35;
                const nearEdge = (this.x <= edgeDistance || this.x >= canvasWidth - edgeDistance || 
                                this.y <= edgeDistance || this.y >= canvasHeight - edgeDistance);
                
                if (nearEdge) {
                    this.edgeTimer++;
                    if (this.edgeTimer >= 120) {
                        this.teleporting = true;
                        this.teleportTimer = 30;
                        
                        teleportEffects.push({
                            x: this.x,
                            y: this.y,
                            life: 20,
                            maxLife: 20,
                            alpha: 1,
                            scale: 1,
                            color: 'rgba(255, 0, 255, 0.8)'
                        });
                    }
                } else {
                    this.edgeTimer = 0;
                }
                
                // Enhanced boundary bouncing
                const margin = this.size + 5;
                if (this.x <= margin) {
                    this.x = margin;
                    this.vx = Math.abs(this.vx) * 0.8;
                    this.vy += (Math.random() - 0.5) * 0.5;
                } else if (this.x >= canvasWidth - margin) {
                    this.x = canvasWidth - margin;
                    this.vx = -Math.abs(this.vx) * 0.8;
                    this.vy += (Math.random() - 0.5) * 0.5;
                }
                
                if (this.y <= margin) {
                    this.y = margin;
                    this.vy = Math.abs(this.vy) * 0.8;
                    this.vx += (Math.random() - 0.5) * 0.5;
                } else if (this.y >= canvasHeight - margin) {
                    this.y = canvasHeight - margin;
                    this.vy = -Math.abs(this.vy) * 0.8;
                    this.vx += (Math.random() - 0.5) * 0.5;
                }
            }
            
            draw(ctx) {
                if (this.teleporting) {
                    return;
                }
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'white';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`${this.name} #${this.number}`, this.x, this.y - 15);
                
                if (this.boosted) {
                    ctx.strokeStyle = '#FFC107';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size + 4, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.strokeStyle = 'rgba(255, 193, 7, 0.5)';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size + 7, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                // Draw whirlpool center effect when in center
                if (this.inWhirlpool && this.whirlpoolCenterTimer > 0) {
                    const intensity = Math.min(this.whirlpoolCenterTimer / 120, 1);
                    ctx.strokeStyle = `rgba(0, 255, 255, ${intensity})`;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size + 8, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    
                    // Draw countdown indicator
                    const timeLeft = Math.ceil((120 - this.whirlpoolCenterTimer) / 60);
                    ctx.fillStyle = `rgba(0, 255, 255, ${intensity})`;
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(`${timeLeft}`, this.x, this.y + 25);
                }
                
                if (this.edgeTimer > 0 && !this.teleporting) {
                    const warningIntensity = Math.min(this.edgeTimer / 120, 1);
                    ctx.strokeStyle = `rgba(255, 0, 255, ${warningIntensity})`;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size + 6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    
                    const timeLeft = Math.ceil((120 - this.edgeTimer) / 60);
                    ctx.fillStyle = `rgba(255, 0, 255, ${warningIntensity})`;
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(`${timeLeft}`, this.x, this.y + 25);
                }
            }
        }
        
        class Shark {
            constructor(sharkImage) {
                this.x = 0;
                this.y = 0;
                this.vx = 0;
                this.vy = 0;
                this.targetVx = 0;
                this.targetVy = 0;
                this.baseSpeed = 3.0;
                this.eating = false;
                this.eatingTimer = 0;
                this.jumpHeight = 0;
                this.size = 20; // Increased size for SVG shark
                this.target = null;
                this.targetChangeTimer = 0;
                this.acceleration = 0.05;
                this.waveTimer = 0;
                this.sharkImage = sharkImage;
                this.imageLoaded = false;
                
                // Rushing mechanics
                this.rushing = false;
                this.rushTimer = 0;
                this.rushDirection = { x: 0, y: 0 };
                this.rushSpeed = 6.0; // 2x base speed
                
                // Check if image is already loaded
                if (this.sharkImage && this.sharkImage.complete) {
                    this.imageLoaded = true;
                }
            }
            
            update(survivors, allSharks, canvasWidth, canvasHeight, rushParticles) {
                this.waveTimer += 0.2;
                
                if (this.eating) {
                    this.eatingTimer--;
                    
                    this.vx = 0;
                    this.vy = 0;
                    this.targetVx = 0;
                    this.targetVy = 0;
                    
                    const totalFrames = 60;
                    const phase1 = totalFrames * 0.25;
                    const phase2 = totalFrames * 0.5;
                    const phase3 = totalFrames * 0.25;
                    
                    if (this.eatingTimer > totalFrames - phase1) {
                        const progress = (totalFrames - this.eatingTimer) / phase1;
                        this.jumpHeight = progress * 60;
                    } else if (this.eatingTimer > phase3) {
                        this.jumpHeight = 60 + Math.sin(this.eatingTimer * 0.3) * 8;
                    } else {
                        const progress = this.eatingTimer / phase3;
                        this.jumpHeight = progress * 60;
                    }
                    
                    if (this.eatingTimer <= 0) {
                        this.eating = false;
                        this.jumpHeight = 0;
                        console.log("Shark finished eating - resuming movement");
                        const randomAngle = Math.random() * Math.PI * 2;
                        this.vx = Math.cos(randomAngle) * this.baseSpeed;
                        this.vy = Math.sin(randomAngle) * this.baseSpeed;
                    }
                    
                    return;
                }
                
                // Handle rushing state
                if (this.rushing) {
                    this.rushTimer--;
                    
                    // Move in the same direction at 2x speed
                    this.vx = this.rushDirection.x * this.rushSpeed;
                    this.vy = this.rushDirection.y * this.rushSpeed;
                    
                    // Add rush particles
                    if (Math.random() < 0.4) {
                        rushParticles.push({
                            x: this.x + (Math.random() - 0.5) * 20,
                            y: this.y + (Math.random() - 0.5) * 20,
                            vx: -this.vx * 0.3 + (Math.random() - 0.5) * 2,
                            vy: -this.vy * 0.3 + (Math.random() - 0.5) * 2,
                            life: 20,
                            maxLife: 20,
                            alpha: 1,
                            size: Math.random() * 4 + 2,
                            color: 'rush'
                        });
                    }
                    
                    if (this.rushTimer <= 0) {
                        this.rushing = false;
                        // Resume normal movement
                        this.vx *= 0.5; // Slow down
                        this.vy *= 0.5;
                        console.log("Shark finished rushing");
                    }
                } else {
                    // Check for rush trigger (5% chance every frame when not eating or rushing)
                    if (Math.random() < 0.005) {
                        this.rushing = true;
                        this.rushTimer = 120; // 2 seconds at 60fps
                        
                        // Set rush direction based on current movement or random
                        if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) {
                            const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                            this.rushDirection.x = this.vx / currentSpeed;
                            this.rushDirection.y = this.vy / currentSpeed;
                        } else {
                            const randomAngle = Math.random() * Math.PI * 2;
                            this.rushDirection.x = Math.cos(randomAngle);
                            this.rushDirection.y = Math.sin(randomAngle);
                        }
                        
                        console.log("Shark started rushing!");
                        return; // Skip normal movement logic
                    }
                    
                    // Normal shark movement logic
                    const speed = this.baseSpeed;
                    
                    this.targetChangeTimer++;
                    
                    if (this.targetChangeTimer > 180 + Math.random() * 180) {
                        this.target = null;
                        this.targetChangeTimer = 0;
                    }
                    
                    if (!this.target || Math.random() < 0.008) {
                        let availableTargets = survivors.filter(survivor => {
                            const isTargetedByOther = allSharks.some(shark => 
                                shark !== this && shark.target === survivor
                            );
                            return !isTargetedByOther && !survivor.teleporting;
                        });
                        
                        if (availableTargets.length === 0) {
                            availableTargets = survivors.filter(s => !s.teleporting);
                        }
                        
                        if (availableTargets.length > 0) {
                            if (Math.random() < 0.4) {
                                this.target = availableTargets[Math.floor(Math.random() * availableTargets.length)];
                            } else {
                                let nearestTarget = null;
                                let nearestDistance = Infinity;
                                
                                availableTargets.forEach(survivor => {
                                    const dx = this.x - survivor.x;
                                    const dy = this.y - survivor.y;
                                    const distance = Math.sqrt(dx * dx + dy * dy);
                                    
                                    if (distance < nearestDistance) {
                                        nearestDistance = distance;
                                        nearestTarget = survivor;
                                    }
                                });
                                
                                this.target = nearestTarget;
                            }
                        }
                    }
                    
                    if (this.target && !this.target.teleporting) {
                        const dx = this.target.x - this.x;
                        const dy = this.target.y - this.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance > 0) {
                            this.targetVx = (dx / distance) * speed;
                            this.targetVy = (dy / distance) * speed;
                        }
                    }
                    
                    this.vx += (this.targetVx - this.vx) * this.acceleration;
                    this.vy += (this.targetVy - this.vy) * this.acceleration;
                }
                
                // Update position
                this.x += this.vx;
                this.y += this.vy;
                
                // Boundary handling
                const effectiveSize = this.size * 1.5;
                const margin = effectiveSize + 5;
                
                if (this.x <= margin) {
                    this.x = margin;
                    this.vx = Math.abs(this.vx) * 0.8;
                    this.vy += (Math.random() - 0.5) * 0.3;
                    if (this.rushing) {
                        this.rushDirection.x = Math.abs(this.rushDirection.x);
                    }
                } else if (this.x >= canvasWidth - margin) {
                    this.x = canvasWidth - margin;
                    this.vx = -Math.abs(this.vx) * 0.8;
                    this.vy += (Math.random() - 0.5) * 0.3;
                    if (this.rushing) {
                        this.rushDirection.x = -Math.abs(this.rushDirection.x);
                    }
                }
                
                if (this.y <= margin) {
                    this.y = margin;
                    this.vy = Math.abs(this.vy) * 0.8;
                    this.vx += (Math.random() - 0.5) * 0.3;
                    if (this.rushing) {
                        this.rushDirection.y = Math.abs(this.rushDirection.y);
                    }
                } else if (this.y >= canvasHeight - margin) {
                    this.y = canvasHeight - margin;
                    this.vy = -Math.abs(this.vy) * 0.8;
                    this.vx += (Math.random() - 0.5) * 0.3;
                    if (this.rushing) {
                        this.rushDirection.y = -Math.abs(this.rushDirection.y);
                    }
                }
            }
            
            startEating() {
                this.eating = true;
                this.eatingTimer = 60;
                this.jumpHeight = 0;
                this.rushing = false; // Stop rushing when eating
                this.rushTimer = 0;
                
                this.vx = 0;
                this.vy = 0;
                this.targetVx = 0;
                this.targetVy = 0;
                
                console.log("Shark started eating!");
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y - this.jumpHeight);
                
                // Apply visual effects for rushing
                if (this.rushing) {
                    // Add orange glow effect for rushing
                    ctx.shadowColor = '#FF6B35';
                    ctx.shadowBlur = 20;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    
                    // Draw rushing outline
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size + 8, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                // If SVG image is loaded and ready, use it
                if (this.sharkImage && this.sharkImage.complete) {
                    const sharkWidth = this.size * 4; // Make shark bigger than before
                    const sharkHeight = this.size * 2.5;
                    
                    // Flip horizontally based on direction (inverted condition)
                    const horizontalFlip = this.vx < 0 ? 1 : -1; // Inverted: normal when moving left, flipped when moving right
                    ctx.scale(horizontalFlip, 1); // Only horizontal flip, no vertical flip
                    
                    // Apply color tint for rushing
                    if (this.rushing) {
                        ctx.filter = 'hue-rotate(20deg) saturate(1.5) brightness(1.2)';
                    }
                    
                    // Draw the SVG shark
                    ctx.drawImage(
                        this.sharkImage,
                        -sharkWidth/2,
                        -sharkHeight/2,
                        sharkWidth,
                        sharkHeight
                    );
                    
                    ctx.filter = 'none'; // Reset filter
                    
                } else {
                    // Fallback to simple circle if SVG not loaded
                    let fillColor = this.eating ? '#8B0000' : '#696969';
                    if (this.rushing) {
                        fillColor = '#FF6B35';
                    }
                    
                    ctx.fillStyle = fillColor;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Simple shark fin indicator
                    ctx.fillStyle = '#2F4F4F';
                    ctx.beginPath();
                    ctx.moveTo(this.size, 0);
                    ctx.lineTo(this.size * 1.5, -this.size * 0.5);
                    ctx.lineTo(this.size * 1.8, 0);
                    ctx.lineTo(this.size * 1.5, this.size * 0.5);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
                
                // Draw waves (less intense when rushing to avoid visual clutter)
                if (!this.rushing) {
                    this.drawWaves(ctx);
                } else {
                    this.drawRushWaves(ctx);
                }
                
                // Draw eating effects
                if (this.eating) {
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2;
                        const distance = this.size * (1.5 + Math.random() * 1);
                        const splashX = this.x + Math.cos(angle) * distance;
                        const splashY = this.y + Math.sin(angle) * distance;
                        
                        ctx.fillStyle = `rgba(135, 206, 235, ${0.6 - Math.random() * 0.3})`;
                        ctx.beginPath();
                        ctx.arc(splashX, splashY, Math.random() * 5 + 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    for (let i = 0; i < 4; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const distance = Math.random() * this.size * 1.0;
                        const dropX = this.x + Math.cos(angle) * distance;
                        const dropY = this.y + Math.sin(angle) * distance;
                        
                        ctx.fillStyle = `rgba(139, 0, 0, ${0.5 - Math.random() * 0.2})`;
                        ctx.beginPath();
                        ctx.arc(dropX, dropY, Math.random() * 2 + 1, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            
            drawWaves(ctx) {
                const waveCount = 3;
                const waveIntensity = 1.0;
                
                for (let i = 0; i < waveCount; i++) {
                    const waveRadius = this.size * (1.5 + i * 0.5) * waveIntensity;
                    const waveAlpha = (1 - i / waveCount) * 0.3;
                    const waveOffset = this.waveTimer + i * Math.PI / 3;
                    
                    ctx.strokeStyle = `rgba(135, 206, 235, ${waveAlpha})`;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([]);
                    
                    ctx.beginPath();
                    for (let angle = 0; angle < Math.PI * 2; angle += 0.1) {
                        const wave = Math.sin(angle * 4 + waveOffset) * 3;
                        const x = this.x + Math.cos(angle) * (waveRadius + wave);
                        const y = this.y + Math.sin(angle) * (waveRadius + wave);
                        
                        if (angle === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
            }
            
            drawRushWaves(ctx) {
                const waveCount = 2;
                const waveIntensity = 1.5;
                
                for (let i = 0; i < waveCount; i++) {
                    const waveRadius = this.size * (2 + i * 0.8) * waveIntensity;
                    const waveAlpha = (1 - i / waveCount) * 0.5;
                    const waveOffset = this.waveTimer * 2 + i * Math.PI / 2;
                    
                    ctx.strokeStyle = `rgba(255, 107, 53, ${waveAlpha})`;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([]);
                    
                    ctx.beginPath();
                    for (let angle = 0; angle < Math.PI * 2; angle += 0.1) {
                        const wave = Math.sin(angle * 6 + waveOffset) * 5;
                        const x = this.x + Math.cos(angle) * (waveRadius + wave);
                        const y = this.y + Math.sin(angle) * (waveRadius + wave);
                        
                        if (angle === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
            }
        }
        
        // Start the game
        const game = new Game();
    </script>
